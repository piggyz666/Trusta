[extend]
useDefault = true

[[allowlists]]
description = "Public RFC 6238 SHA-1 test vector in archived unit tests only; not an account secret"
condition = "AND"
regexTarget = "secret"
regexes = ['''^GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ$''']
paths = ['''(^|/)legacy-bank/tests/(bank-scenarios|bank-accounts)\.test\.mjs$''']

