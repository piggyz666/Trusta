<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="figure.css" />
<style>
  .top { display: grid; grid-template-columns: 440px 1fr; gap: 34px; }

  /* a — threats and answers */
  .threats { display: grid; gap: 10px; }
  .tr { display: grid; grid-template-columns: 1fr 22px 1fr; align-items: stretch; }
  .tr .bad, .tr .good { border-radius: 9px; padding: 9px 11px; }
  .tr .bad { background: var(--redF); border: 1px solid #efc3ba; }
  .tr .good { background: var(--tealF); border: 1px solid #b9ddd8; }
  .tr h4 { margin: 0 0 3px; font-size: 13.5px; font-weight: 750; }
  .tr .bad h4 { color: var(--red); }
  .tr .good h4 { color: var(--tealD); }
  .tr p { margin: 0; font-size: 11.5px; line-height: 1.42; color: var(--sub); }
  .tr .mid { display: grid; place-items: center; color: var(--faint); font-size: 15px; }
  .colhead { display: grid; grid-template-columns: 1fr 22px 1fr; font-size: 11px; font-weight: 700; color: var(--faint); letter-spacing: .04em; margin-bottom: 2px; }

  /* b — swimlanes */
  .lanes { display: grid; grid-template-columns: 74px repeat(9, 1fr); grid-template-rows: 70px 74px 74px 74px 66px; column-gap: 10px;
    border: 1px solid var(--hair); border-radius: 12px; overflow: visible; position: relative; background: linear-gradient(var(--soft), var(--soft)) no-repeat; }
  .lane-bg { grid-column: 1 / -1; border-top: 1px solid var(--hair); }
  .lane-bg:first-child { border-top: 0; }
  .lane-label { grid-column: 1; display: flex; align-items: center; padding-left: 12px; font-size: 11.5px; font-weight: 750; color: var(--sub); line-height: 1.25; z-index: 1; }
  .node { z-index: 2; align-self: center; border-radius: 9px; padding: 7px 8px; text-align: center; font-size: 11px; line-height: 1.3; color: var(--sub); background: #fff; border: 1.2px solid var(--line); }
  .node b { display: block; font-size: 12.5px; color: var(--ink); font-weight: 750; margin-bottom: 1px; }
  .node.user { background: var(--ink); border-color: var(--ink); color: #e9ebee; }
  .node.user b { color: #fff; }
  .node.ai { background: var(--blueF); border-color: #b7cbe6; }
  .node.agent { background: var(--tealF); border-color: #9fd0c9; }
  .node.policy { background: var(--amberF); border-color: #ecd09a; }
  .node.confirm { background: #fff; border: 2px solid var(--amber); box-shadow: 0 0 0 4px var(--amberF); }
  .node.exec { background: var(--slateF); border-color: #c4ccd7; }
  .ev { z-index: 2; align-self: center; justify-self: center; font-family: var(--mono); font-size: 10.5px; padding: 4px 8px; border-radius: 6px; background: #fff; border: 1.2px solid var(--teal); color: var(--tealD); white-space: nowrap; }
  .ev.ck { font-family: var(--sans); font-weight: 700; background: var(--tealD); color: #fff; border-color: var(--tealD); padding: 6px 9px; font-size: 11px; }
  .gate { position: absolute; z-index: 3; width: 19px; height: 19px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 10.5px; font-weight: 800;
    display: grid; place-items: center; font-family: var(--sans); }
  .boundary { position: absolute; z-index: 1; top: 74px; bottom: 6px; border-left: 2.5px dashed var(--red); }
  .boundary span { position: absolute; top: -4px; left: 8px; width: 150px; font-size: 11.5px; font-weight: 800; color: var(--red); line-height: 1.3; background: rgba(255,255,255,.92); padding: 3px 6px; border-radius: 5px; }
  .tally { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .tally div { display: flex; align-items: baseline; gap: 7px; padding: 7px 12px; border-radius: 9px; background: var(--soft); border: 1px solid var(--hair); font-size: 12px; color: var(--sub); }
  .tally b { font-size: 17px; color: var(--ink); font-weight: 800; }

  /* c — attack × gate matrix */
  .bottom { display: grid; grid-template-columns: 1fr 300px; gap: 30px; margin-top: 30px; }
  table { border-collapse: collapse; width: 100%; font-size: 11.5px; }
  th { font-weight: 700; color: var(--sub); text-align: center; padding: 0 2px 7px; vertical-align: bottom; line-height: 1.25; font-size: 11px; }
  th .gate { position: static; margin: 0 auto 5px; }
  th.atk { text-align: left; }
  td { border-top: 1px solid var(--hair); padding: 4px 4px; text-align: center; height: 25px; }
  td.atk { text-align: left; white-space: nowrap; }
  td.atk b { font-weight: 650; color: var(--ink); }
  td.atk span { color: var(--faint); margin-left: 7px; }
  td.grp { writing-mode: vertical-rl; font-size: 11px; font-weight: 750; color: var(--sub); border-top: 2px solid var(--line); padding: 2px 0; width: 22px; }
  tr.first td { border-top: 2px solid var(--line); }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); }
  .dot.c1 { background: var(--teal); } .dot.c2 { background: var(--amber); } .dot.c3 { background: var(--purple); }
  td.res { font-weight: 750; color: var(--green); white-space: nowrap; }
  td.tx { color: var(--sub); font-family: var(--mono); }
  .gcol { background: #fafbfc; }
  html[lang="en"] td.grp { transform: rotate(180deg); }
  .checks { position: absolute; z-index: 3; display: flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 700; color: var(--ink);
    background: #fff; border: 1px solid var(--line); border-radius: 99px; padding: 3px 9px 3px 4px; white-space: nowrap; }
  .checks .gate { position: static; width: 17px; height: 17px; font-size: 10px; }

  .facts { display: grid; gap: 12px; align-content: start; }
  .fact { border-left: 3px solid var(--teal); padding: 6px 0 6px 13px; }
  .fact b { display: block; font-size: 26px; font-weight: 800; letter-spacing: -.01em; line-height: 1.1; }
  .fact span { display: block; font-size: 12.5px; font-weight: 700; margin-top: 3px; }
  .fact p { margin: 3px 0 0; font-size: 11.5px; line-height: 1.45; color: var(--sub); }
  .fact.red { border-color: var(--red); } .fact.amber { border-color: var(--amber); }
</style>
</head>
<body>
<div id="fig"></div>
<script src="figure.js"></script>
<script>
const fig = document.getElementById("fig");

const THREATS = [
  [T("冒充", "Impersonation"), T("被攻破的交易 Agent 假装成总控下达指令", "A compromised Transaction agent poses as the Supervisor"),
   T("独立密钥身份", "Separate key identities"), T("每个 Agent 一把 ECDSA P-256 密钥，私钥加密存储", "One ECDSA P-256 key per agent, encrypted at rest")],
  [T("篡改与重放", "Tampering and replay"), T("把 ¥500 改成 ¥50,000，或把旧消息再发一次", "Turning ¥500 into ¥50,000, or resending an old message"),
   T("签名信封", "Signed envelope"), T("负载哈希 + 一次性 nonce + 5 分钟有效期 + 绑定接收方", "Payload hash + one-time nonce + 5-min expiry + bound recipient")],
  [T("越权", "Overreach"), T("财务 Agent 突然发出一条“转账提案”", "The Finance agent suddenly sends a “transfer proposal”"),
   T("能力快照与通信边", "Capability snapshot and edges"), T("权限承诺随消息签名；只允许计划内的收发组合", "Permissions committed in each message; only planned sender→receiver pairs")],
  [T("事后抵赖", "Denial afterwards"), T("出了事，谁也说不清是哪一步、哪个 Agent", "Something goes wrong and nobody can say which step or agent"),
   T("证据因果链", "Causal evidence chain"), T("每次交接再签名、引用前一条，写入审计链与 Merkle 检查点", "Every hand-off re-signed, linked to the last, sealed in the audit chain")],
];

const GATES = [
  [T("身份与密钥", "Identity & key")], [T("签名", "Signature")], [T("时效与 nonce", "Expiry & nonce")], [T("能力与通信边", "Capability & edges")],
  [T("你的授权", "Your authorisation")], [T("执行合约", "Execution contract")], [T("审计链与 Merkle", "Audit chain & Merkle")],
];
const ATTACKS = [
  [T("身份与消息", "Identity & messages"), 1, [
    [T("伪造 Agent 身份", "Forged agent identity"), T("用注册表外的身份发消息", "sends as an unregistered agent"), 1],
    [T("无效签名", "Invalid signature"), T("签名与消息不符", "signature doesn't match"), 2],
    [T("负载篡改", "Payload tampering"), T("签名后改金额", "amount changed after signing"), 2],
    [T("签名算法降级", "Algorithm downgrade"), T("诱导使用弱算法", "coaxes a weaker algorithm"), 2],
    [T("重放", "Replay"), T("重发已用过的消息", "resends a used message"), 3],
    [T("过期消息", "Expired message"), T("超过 5 分钟有效期", "past its 5-minute validity"), 3],
    [T("已吊销密钥", "Revoked key"), T("用吊销的密钥签名", "signed with a revoked key"), 1],
    [T("宽限期外旧密钥", "Old key after rotation"), T("轮换后仍用旧密钥", "old key used after the grace period"), 1],
  ]],
  [T("权限与执行", "Permissions & execution"), 2, [
    [T("越权调用", "Capability escalation"), T("声称没有的能力", "claims a capability it lacks"), 4],
    [T("能力快照篡改", "Snapshot tampering"), T("改动权限承诺", "alters the permission commitment"), 4],
    [T("未授权工具调用", "Unauthorised tool call"), T("调用计划外的工具", "calls a tool outside the plan"), 4],
    [T("授权与操作不符", "Authorisation mismatch"), T("拿 A 的授权执行 B", "uses A's approval to run B"), 5],
    [T("重复执行", "Duplicate execution"), T("同一笔钱执行两次", "executes the same payment twice"), 6],
  ]],
  [T("审计与证明", "Audit & proofs"), 3, [
    [T("审计事件篡改", "Audit event tampering"), T("改动一条审计记录", "edits an audit record"), 7],
    [T("Merkle 叶子篡改", "Merkle leaf tampering"), T("改动被证明的记录", "edits a proven record"), 7],
    [T("伪造包含证明", "Forged inclusion proof"), T("伪造 Merkle 路径", "fakes a Merkle path"), 7],
    [T("检查点篡改", "Checkpoint tampering"), T("改动签名检查点", "edits a signed checkpoint"), 7],
    [T("锚定根不符", "Anchor root mismatch"), T("检查点与锚定根不一致", "checkpoint ≠ anchored root"), 7],
  ]],
];

fig.innerHTML = `
<div class="headline">
  <div class="fig-n">${T("图 1", "Figure 1")}</div>
  <h1>${T("AI 只能提议；Agent 之间的每一步都签名、可验证", "The AI can only propose; every step between agents is signed and verifiable")}</h1>
  <p>${T("一句“给张三转500元”要经过多个 Agent 的签名交接、你的一次授权和 7 道关卡。任何一个 Agent 被攻破，都无法冒充、篡改、越权或事后抵赖。",
        "“Send ¥500 to Zhang San” passes signed hand-offs between agents, one authorisation by you and seven gates. A compromised agent can't impersonate, tamper, overreach or deny it later.")}</p>
</div>

<div class="top">
  <section class="panel">
    <div class="ptitle"><b>a</b><span>${T("问题：一个被攻破的 Agent 能做什么", "The problem: what a compromised agent could do")}</span></div>
    <div class="colhead"><span>${T("没有防护时", "Without protection")}</span><span></span><span>${T("TRUSTA 的做法", "What TRUSTA does")}</span></div>
    <div class="threats">
      ${THREATS.map(([a, b, c, d]) => `<div class="tr"><div class="bad"><h4>${a}</h4><p>${b}</p></div><div class="mid">→</div><div class="good"><h4>${c}</h4><p>${d}</p></div></div>`).join("")}
    </div>
  </section>

  <section class="panel">
    <div class="ptitle"><b>b</b><span>${T("一句话到一笔交易：每次交接都签名，只有你能授权", "From a sentence to a transaction: every hand-off signed, only you can authorise")}</span></div>
    <div class="lanes" id="lanes">
      ${[1, 2, 3, 4, 5].map((r) => `<div class="lane-bg" style="grid-row:${r}"></div>`).join("")}
      <div class="lane-label" style="grid-row:1">${T("你", "You")}</div>
      <div class="lane-label" style="grid-row:2">${T("AI 理解层", "AI layer")}</div>
      <div class="lane-label" style="grid-row:3">${T("Agent 协作", "Agents")}</div>
      <div class="lane-label" style="grid-row:4">${T("执行与银行", "Execution & bank")}</div>
      <div class="lane-label" style="grid-row:5">${T("审计证据", "Audit evidence")}</div>

      <div class="node user" id="u1" style="grid-row:1;grid-column:2/4">${T("<b>“给张三转500元”</b>你的原话", "<b>“Send ¥500 to Zhang San”</b>your own words")}</div>
      <div class="node ai" id="a1" style="grid-row:2;grid-column:2">${T("<b>大模型</b>只给候选调用", "<b>LLM</b>candidates only")}</div>
      <div class="node ai" id="a2" style="grid-row:2;grid-column:3">${T("<b>校验器</b>每个参数须有原话出处", "<b>Validator</b>each value quoted from you")}</div>
      <div class="node agent" id="g1" style="grid-row:3;grid-column:4">${T("<b>总控</b>Supervisor", "<b>Supervisor</b>intent + origin")}</div>
      <div class="node agent" id="g2" style="grid-row:3;grid-column:5">${T("<b>规划</b>Planner", "<b>Planner</b>task graph")}</div>
      <div class="node agent" id="g3" style="grid-row:3;grid-column:6">${T("<b>交易</b>提出转账方案", "<b>Transaction</b>proposes transfer")}</div>
      <div class="node policy" id="p1" style="grid-row:3;grid-column:7">${T("<b>策略引擎</b>银行规则定级", "<b>Policy engine</b>bank rules set tier")}</div>
      <div class="node confirm" id="c1" style="grid-row:1;grid-column:7/9">${T("<b>确认卡：你点确认</b>红色另需验证码 · 唯一授权入口", "<b>Confirmation card: you tap confirm</b>red adds a code · the only way in")}</div>
      <div class="node exec" id="x1" style="grid-row:4;grid-column:8">${T("<b>执行合约</b>只执行一次", "<b>Contract</b>sealed, runs once")}</div>
      <div class="node exec" id="x2" style="grid-row:4;grid-column:9">${T("<b>银行网关</b>执行转账", "<b>Bank gateway</b>executes")}</div>
      <div class="node exec" id="x3" style="grid-row:4;grid-column:10">${T("<b>独立核验</b>前后状态 → 回执", "<b>Verifier</b>before/after → receipt")}</div>

      <div class="ev" id="e1" style="grid-row:5;grid-column:4">E₁ REQUEST</div>
      <div class="ev" id="e2" style="grid-row:5;grid-column:5">E₂ PLAN</div>
      <div class="ev" id="e3" style="grid-row:5;grid-column:6">E₃ PROPOSED</div>
      <div class="ev" id="e4" style="grid-row:5;grid-column:8">E₄ AUTHORISED</div>
      <div class="ev" id="e5" style="grid-row:5;grid-column:9">E₅ EXECUTED</div>
      <div class="ev ck" id="ck" style="grid-row:5;grid-column:10">${T("签名 Merkle 检查点", "Signed Merkle checkpoint")}</div>
      <div class="boundary" id="bd"><span>${T("AI 的权限到此为止：<br>只能提议，不能授权", "The AI stops here:<br>it proposes, never authorises")}</span></div>
    </div>
    <div class="tally">
      <div><b>3</b>${T("次 Agent 间签名交接，每次都由接收方验签", "signed agent hand-offs, each verified by the receiver")}</div>
      <div><b>1</b>${T("次由你授权（绑定 action_hash）", "authorisation, by you (bound to action_hash)")}</div>
      <div><b>5</b>${T("条交接证据串成因果链，封进签名检查点，可离线验证", "evidence records chained and sealed in a signed checkpoint, verifiable offline")}</div>
    </div>
  </section>
</div>

<div class="bottom">
  <section class="panel">
    <div class="ptitle"><b>c</b><span>${T("实测：18 类攻击各打 5 次，分别被哪一道关卡拦下", "Measured: 18 attacks × 5 runs, and which gate stops each")}</span>
      <em>${T("● = 拦截该攻击的关卡；编号与 b 中一致", "● = the gate that blocks it; numbers match panel b")}</em></div>
    <table>
      <thead><tr><th></th><th class="atk">${T("攻击（它想做什么）", "Attack (what it tries)")}</th>
        ${GATES.map(([g], i) => `<th class="gcol"><div class="gate">${i + 1}</div>${g}</th>`).join("")}
        <th>${T("结果", "Result")}</th><th>${T("意外交易", "Unintended tx")}</th></tr></thead>
      <tbody>
        ${ATTACKS.map(([grp, c, rows]) => rows.map(([name, what, g], i) => `<tr class="${i === 0 ? "first" : ""}">
          ${i === 0 ? `<td class="grp" rowspan="${rows.length}">${grp}</td>` : ""}
          <td class="atk"><b>${name}</b><span>${what}</span></td>
          ${GATES.map((_, k) => `<td class="gcol">${k + 1 === g ? `<span class="dot c${c}"></span>` : ""}</td>`).join("")}
          <td class="res">5 / 5 ${T("拦截", "blocked")}</td><td class="tx">0</td></tr>`).join("")).join("")}
      </tbody>
    </table>
  </section>
  <aside class="facts">
    <div class="ptitle"><b>&nbsp;</b><span>${T("这些数字意味着什么", "What the numbers mean")}</span></div>
    <div class="fact"><b>90 / 90</b><span>${T("次攻击全部被拦下", "attacks stopped")}</span><p>${T("每一类都真实发起 5 次，没有一次进入执行。", "Each class was really attempted five times; none reached execution.")}</p></div>
    <div class="fact red"><b>0</b><span>${T("笔意外交易", "unintended transactions")}</span><p>${T("隔离的沙箱银行里，攻击期间余额和流水没有任何未授权变化。", "In an isolated sandbox bank, no unauthorised balance or ledger change occurred.")}</p></div>
    <div class="fact amber"><b>0 / 135</b><span>${T("条正常消息被误拒", "legitimate messages wrongly rejected")}</span><p>${T("关卡严格，但不误伤正常业务。", "Strict gates that don't block normal work.")}</p></div>
    <div class="fact"><b>5.5 ms</b><span>${T("验证一条消息（中位数）", "to verify a message (median)")}</span><p>${T("一笔转账全程约 1.7 秒，签名带来的开销几乎感觉不到。", "A whole transfer takes about 1.7 s, so signing adds almost nothing you'd notice.")}</p></div>
  </aside>
</div>
<div class="foot">${T("实测环境：本地受控攻击，Windows 11 / Python 3.13 / cryptography 47，隔离 SQLite 沙箱银行。复现：python -m benchmarks.security_benchmark --banking-version 5；原始数据见 docs/phase5-security-benchmark.json。这是受控实验，不是生产渗透测试。",
  "Setup: local controlled attacks on Windows 11 / Python 3.13 / cryptography 47 with an isolated SQLite sandbox bank. Reproduce: python -m benchmarks.security_benchmark --banking-version 5; raw data in docs/phase5-security-benchmark.json. A controlled experiment, not a production penetration test.")}</div>
`;

document.fonts.ready.then(() => {
  initWires();
  // boundary sits between the validator and the Supervisor columns
  const L = rect("#lanes"), a2 = rect("#a2"), g1 = rect("#g1");
  const bd = document.getElementById("bd");
  bd.style.left = ((a2.r + g1.x) / 2 - L.x) + "px";

  const g = (n, sel, dx, dy) => {   // gate badge next to an element
    const q = rect(sel), d = document.createElement("div");
    d.className = "gate"; d.textContent = n;
    d.style.left = (q.x - L.x + (dx ?? q.w - 10)) + "px"; d.style.top = (q.y - L.y + (dy ?? -9)) + "px";
    document.getElementById("lanes").append(d);
  };
  path([port("#u1", "b", 0.25), port("#a1", "t")], { color: "ink", label: T("原话", "your words"), dx: 36, dy: 2 });
  path([port("#a1", "r"), port("#a2", "l")], { color: "blue" });
  path([port("#a2", "b"), [rect("#a2").cx, rect("#g1").cy], port("#g1", "l")], { color: "teal", label: T("意图 + 原话哈希", "intent + origin"), seg: 0, dx: -46, dy: 6, halo: true });
  path([port("#g1", "r"), port("#g2", "l")], { color: "teal" });
  path([port("#g2", "r"), port("#g3", "l")], { color: "teal" });
  path([port("#g3", "r"), port("#p1", "l")], { color: "teal" });
  { const c = rect("#c1"), pp = rect("#p1"), x1 = rect("#x1");
    path([[pp.cx, pp.y], [pp.cx, c.b]], { color: "amber", label: T("黄 / 红", "yellow / red"), dx: -26, dy: 0, halo: true });
    path([[x1.cx, c.b], [x1.cx, x1.y]], { color: "amber", label: "action_hash", mono: true, ls: 10, dx: 40, dy: 0, halo: true }); }
  path([port("#x1", "r"), port("#x2", "l")], { color: "slate" });
  path([port("#x2", "r"), port("#x3", "l")], { color: "slate" });
  for (const [from, to] of [["#g1", "#e1"], ["#g2", "#e2"], ["#g3", "#e3"]]) path([port(from, "b"), port(to, "t")], { color: "teal", dash: "3 3", w: 1.2 });
  path([port("#x1", "b"), port("#e4", "t")], { color: "teal", dash: "3 3", w: 1.2 });
  path([port("#x2", "b"), port("#e5", "t")], { color: "teal", dash: "3 3", w: 1.2 });
  for (const [a, b] of [["#e1", "#e2"], ["#e2", "#e3"], ["#e3", "#e4"], ["#e4", "#e5"], ["#e5", "#ck"]]) path([port(b, "l"), port(a, "r")], { color: "teal", w: 1.3 });
