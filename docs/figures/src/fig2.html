text(cx0, 618, "实心 = 两个用于读回核对的 RPC 节点", { anchor: "middle", size: 10.5, color: C.sub });

arrow([[846, 322], [846, 414], [543, 414], [543, 598], [528, 598]], { marker: "arrBlue", color: C.blue, label: "写入决策根", at: 0, dx: 36, dy: 10, lc: C.blue });
